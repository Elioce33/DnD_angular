<header>
  <h1>D&D information here</h1>
  <nav>
    <ul>
      @for (page of navPages; track page.title) {
        <li>
          <a class="ribbon" [routerLink]="page.path" routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: true }" ariaCurrentWhenActive="page">{{page.title}}</a>
        </li>  
      }
    </ul>
  </nav>
</header>
<!-- The routed views render in the <router-outlet>-->
<main>
  <router-outlet></router-outlet>
</main>
