<div class="container">
    <h1>List of classes</h1>
    @if (!this.classCount) {
        <i>loading</i>
    } @else {
        <div class="classes">
            <div class="list">
                <h2>Class list</h2>
                <ul>
                    @for (dndClass of this.classes; track dndClass.index) {
                        <li [class]=" selectedClass?.index === dndClass.index ? 'selected' : '' ">
                            <div class="classListItem">{{ dndClass.name }}</div>
                            <button (click)="displayClass(dndClass)">show</button>
                        </li>
                    }
                </ul>
            </div>
            <div class="details">
                @if (this.selectedClass) {
                    <app-class-details [classDetails]="this.selectedClass" />
                }
            </div>
        </div>
    }
</div>
