<h4>Spells list</h4>
<span>total: {{spellReferences.length}}</span>
<div class="levelSelector">
    <p>
        Select a level :
        @for (idx of [1, 2, 3, 4, 5, 6, 7, 8, 9]; track idx) {
            <button (click)="selectLevel(idx)">{{ idx }}</button>
        }
    </p>
</div>
<ul>
    @for (spell of spells; track spell.index) {
        <!-- TODO : make clickable -->
        <li>{{ spell.name }}</li>
    }
</ul>
